name: QMS CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "hotfix/**"

jobs:
  qms-quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PMQMS_ODOO_DEV_SECRETS_DIR: /tmp/pmqms-odoo-dev

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m compileall addons deployment/demo deployment/scripts

      - name: Run Demo seed idempotency tests
        run: python -m unittest discover -s deployment/demo/tests -p 'test_*.py'

      - name: Validate addon manifests and XML
        run: python deployment/scripts/validate-addons.py

      - name: Secret scan
        run: python deployment/scripts/secret-scan.py

      - name: External-standard content safety scan
        run: python deployment/scripts/qms-content-safety.py

      - name: GitHub-only governance regression
        run: bash deployment/scripts/tests/test_governance_source_of_truth.sh

      - name: Validate Docker Compose configuration
        run: bash deployment/scripts/odoo-dev.sh config

      - name: Run customer deployment script regressions
        run: bash deployment/scripts/tests/test_customer_instance_cleanup.sh

      - name: Run customer bootstrap scope regressions
        run: bash deployment/scripts/tests/test_customer_bootstrap_scope.sh

      - name: Run controlled customer upgrade and rollback regressions
        run: bash deployment/scripts/tests/test_customer_instance_upgrade.sh

      - name: Run M29.1 backup and recovery regressions
        run: python -m unittest tools.backup.test_m29_backup

      - name: Run M29.1 real age integration
        run: bash tools/backup/test_m29_real_age.sh

      - name: Run M29.1 disposable Linux Odoo restore rehearsal
        run: bash deployment/scripts/tests/test_customer_instance_restore.sh

      - name: Run M29.2 scheduler tests
        run: python -m unittest tools.backup.test_m29_scheduler

      - name: Validate M29.2 systemd units and installation idempotency
        run: bash deployment/scripts/tests/test_customer_backup_scheduler.sh

      - name: Run M29.2 disposable recurring rehearsal
        run: bash tools/backup/test_m29_scheduler_rehearsal.sh

      - name: Run M29.2 disposable systemd runtime rehearsal
        run: bash tools/backup/test_m29_systemd_runtime.sh

      - name: Run customer effective license status regression
        run: bash deployment/scripts/tests/test_customer_instance_license_status.sh

      - name: Run runtime lock regressions
        run: bash deployment/scripts/tests/test_runtime_lock.sh

      - name: Pull DEV runtime images
        run: bash deployment/scripts/odoo-dev.sh pull

      - name: Run Odoo Mission 16 tests
        run: bash deployment/scripts/odoo-dev.sh test-mission16

      - name: Run Odoo Mission 23 tests
        run: bash deployment/scripts/odoo-dev.sh test-mission23
