name: QMS CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "feature/**"

jobs:
  qms-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PMQMS_ODOO_DEV_SECRETS_DIR: ${{ runner.temp }}/pmqms-odoo-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m compileall addons deployment/scripts

      - name: Validate addon manifests and XML
        run: python deployment/scripts/validate-addons.py

      - name: Secret scan
        run: python deployment/scripts/secret-scan.py

      - name: External-standard content safety scan
        run: python deployment/scripts/qms-content-safety.py

      - name: Validate Docker Compose configuration
        run: bash deployment/scripts/odoo-dev.sh config

      - name: Pull DEV runtime images
        run: bash deployment/scripts/odoo-dev.sh pull

      - name: Run Odoo Mission 09 tests
        run: bash deployment/scripts/odoo-dev.sh test-mission09
