name: pmqms-oliva-pilot

services:
  postgres-oliva-pilot:
    image: postgres:15
    container_name: pmqms-postgres-oliva-pilot
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/secrets/odoo_pg_password
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pmqms_oliva_pilot_postgres:/var/lib/postgresql/data/pgdata
    secrets:
      - odoo_pg_password
    networks:
      - pmqms_oliva_pilot_network

  odoo-oliva-pilot:
    image: odoo:19.0
    container_name: pmqms-odoo-oliva-pilot
    restart: unless-stopped
    depends_on:
      postgres-oliva-pilot:
        condition: service_healthy
    ports:
      - "${ODOO_OLIVA_PILOT_HTTP_BIND:-127.0.0.1}:${ODOO_OLIVA_PILOT_HTTP_PORT:-8169}:8069"
      - "${ODOO_OLIVA_PILOT_LONGPOLLING_BIND:-127.0.0.1}:${ODOO_OLIVA_PILOT_LONGPOLLING_PORT:-8172}:8072"
    environment:
      HOST: postgres-oliva-pilot
      PORT: "5432"
      USER: odoo
      PASSWORD_FILE: /run/secrets/odoo_pg_password
    command: ["odoo", "--log-level=info"]
    volumes:
      - ../../../addons:/mnt/extra-addons:rw
      - ${ODOO_OLIVA_PILOT_CONFIG_DIR:-/opt/perfect-match/secrets/odoo-oliva-pilot/config}:/etc/odoo:ro
      - pmqms_oliva_pilot_odoo_data:/var/lib/odoo
    secrets:
      - odoo_pg_password
    networks:
      - pmqms_oliva_pilot_network

secrets:
  odoo_pg_password:
    file: ${ODOO_OLIVA_PILOT_PG_PASSWORD_FILE:-/opt/perfect-match/secrets/odoo-oliva-pilot/odoo_pg_password}

volumes:
  pmqms_oliva_pilot_postgres:
    name: pmqms_oliva_pilot_postgres
  pmqms_oliva_pilot_odoo_data:
    name: pmqms_oliva_pilot_odoo_data

networks:
  pmqms_oliva_pilot_network:
    name: pmqms_oliva_pilot_network
    driver: bridge
